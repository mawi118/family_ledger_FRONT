openapi: 3.0.0
info:
  title: BFF API
  description: API для авторизации, регистрации и выхода
  version: 1.0.0
servers:
  - url: http://localhost:4000/api
    description: Local development server

paths:
  /auth/register:
    post:
      summary: Регистрация нового пользователя
      description: Создает нового пользователя и сразу возвращает JWT токен для авторизации
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
              additionalProperties: false
      responses:
        '201':
          description: Пользователь успешно зарегистрирован и авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '400':
          description: Ошибка валидации (неверные данные)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Пользователь с такой почтой уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      summary: Авторизация пользователя
      description: Вход в систему по почте и паролю
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthUserRequest'
              additionalProperties: false
      responses:
        '200':
          description: Успешная авторизация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Неверные учетные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      summary: Выход из системы
      description: Инвалидация JWT токена (выход пользователя)
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Успешный выход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutUserResponse'
                
        '401':
          description: Не авторизован (токен отсутствует или невалидный)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: Сообщение об ошибке
          example: "Неверный email или пароль"
        statusCode:
          type: integer
          description: HTTP статус код
          example: 401
    AuthUserResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT токен для доступа к API
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiIxMjMiLCJlbWFpbCI6InVzZXJAZXhhbXBsZS5jb20iLCJpYXQiOjE1MTYyMzkwMjJ9.4Q6rV8iQh_lQUR-0M7A8kZ6KQVsQhq7RwVXxtjDhPWs"
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: "123e4567-e89b-12d3-a456-426614174000"
            email:
              type: string
              example: "user@example.com"
            firstName:
              type: string
              example: "Дио"
    AuthUserRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Электронная почта пользователя
          example: "user@example.com"
        password:
          type: string
          format: password
          description: Пароль пользователя
          example: "securePass123"
    RegisterUserRequest:
      type: object
      required:
        - email
        - password
        - firstName
      properties:
        email:
          type: string
          format: email
          description: Электронная почта пользователя
          example: "user@example.com"
        password:
          type: string
          format: password
          description: Пароль
          minLength: 8
          example: "securePass123"
        firstName:
          type: string
          description: Имя пользователя
          minLength: 2
          example: "Дио"
    LogoutUserResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Успешный выход из системы"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT токен для доступа к защищенным маршрутам