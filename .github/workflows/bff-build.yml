name: BFF Build & Push

on:
  push:
    branches: [master]
    paths:
      - 'family-ledger-bff/**'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./family-ledger-bff
          push: true
          tags: |
            ghcr.io/mawi118/family_ledger_bff:latest
            ghcr.io/mawi118/family_ledger_bff:${{ github.sha }}